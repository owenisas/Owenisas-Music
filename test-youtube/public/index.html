<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Downloader & Converter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b; /* Obsidian black */
      --card-bg: #141416; /* Deep dark slate */
      --card-border: rgba(255, 255, 255, 0.05);
      --text: #f4f4f5; /* Off-white */
      --text-muted: #71717a; /* Neutral zinc grey */
      --accent: #ffffff; /* White high-contrast */
      --accent-dim: #a1a1aa;
      --error: #ef4444;
      --success: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      line-height: 1.5;
    }

    .app-wrapper {
      width: 100%;
      max-width: 580px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: fadeIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .main-container {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    header {
      margin-bottom: 32px;
      text-align: left;
    }

    h1 {
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -0.5px;
      color: var(--text);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Downloader Input Form */
    .downloader-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      position: relative;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      background-color: #09090b;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      transition: all 0.2s ease;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn {
      width: 100%;
      padding: 16px 24px;
      background-color: var(--accent);
      color: #000000;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background-color: #e4e4e7;
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      background-color: #27272a;
      color: var(--text-muted);
      cursor: not-allowed;
      transform: none;
    }

    /* Metadata details */
    .metadata-card {
      margin-top: 28px;
      border-top: 1px solid var(--card-border);
      padding-top: 28px;
      display: none;
      animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .video-info-wrapper {
      display: flex;
      gap: 20px;
      margin-bottom: 24px;
    }

    .video-thumbnail-container {
      width: 130px;
      aspect-ratio: 16/9;
      flex-shrink: 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
      background-color: #000;
    }

    .video-thumbnail {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .video-details {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .metadata-title {
      font-weight: 600;
      font-size: 16px;
      color: var(--text);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 4px;
      line-height: 1.3;
    }

    .metadata-artist {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Select Dropdown */
    .dropdown-container {
      margin-bottom: 24px;
    }

    .dropdown-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    select {
      width: 100%;
      padding: 14px 18px;
      background-color: #09090b;
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
    }

    /* Progress details */
    .progress-container {
      display: none;
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 4px;
      background-color: #27272a;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background-color: var(--accent);
      transition: width 0.2s ease;
    }

    .progress-labels {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
    }

    /* Custom Audio Player */
    .custom-player {
      display: none;
      background-color: #09090b;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px 20px;
      margin-top: 10px;
      flex-direction: column;
      gap: 12px;
      animation: fadeIn 0.4s ease;
    }

    .player-controls-wrapper {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .player-btn {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: rgba(255, 255, 255, 0.04);
      transition: all 0.2s ease;
    }

    .player-btn:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .player-btn svg {
      width: 16px;
      height: 16px;
      fill: var(--text);
    }

    .player-timeline-container {
      flex-grow: 1;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .player-time {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: var(--text-muted);
      min-width: 32px;
    }

    .player-slider {
      flex-grow: 1;
      appearance: none;
      height: 3px;
      border-radius: 1.5px;
      background: #27272a;
      outline: none;
      cursor: pointer;
      position: relative;
    }

    .player-slider::-webkit-slider-thumb {
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--text);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    .player-slider::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }

    .player-volume-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .volume-icon {
      cursor: pointer;
    }

    .volume-icon svg {
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
      transition: fill 0.2s ease;
    }

    .volume-icon:hover svg {
      fill: var(--text);
    }

    .volume-slider {
      width: 60px;
      appearance: none;
      height: 3px;
      border-radius: 1.5px;
      background: #27272a;
      outline: none;
      cursor: pointer;
    }

    .volume-slider::-webkit-slider-thumb {
      appearance: none;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-muted);
    }

    .volume-slider::-webkit-slider-thumb:hover {
      background: var(--text);
    }

    /* Console Drawer */
    .console-drawer-trigger {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      cursor: pointer;
      background: none;
      border: none;
      margin: 16px auto 0 auto;
      transition: color 0.2s ease;
    }

    .console-drawer-trigger:hover {
      color: var(--text);
    }

    .console-drawer {
      height: 0;
      overflow: hidden;
      transition: height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      border-top: 1px solid transparent;
      margin-top: 12px;
    }

    .console-drawer.open {
      height: 150px;
      border-top: 1px solid var(--card-border);
      padding-top: 12px;
    }

    .console {
      width: 100%;
      height: 100%;
      background-color: #09090b;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--accent-dim);
      overflow-y: auto;
      line-height: 1.5;
    }

    .console-line {
      margin-bottom: 4px;
    }

    .console-line.info { color: #60a5fa; }
    .console-line.success { color: var(--success); }
    .console-line.warning { color: #fbbf24; }
    .console-line.error { color: var(--error); }

    /* Ads / Sponsor banner */
    .sponsor-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .sponsor-header {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 600;
    }

    .sponsor-placeholder {
      width: 100%;
      height: 90px;
      border-radius: 8px;
      background-color: #09090b;
      border: 1px dashed rgba(255,255,255,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 12px;
      transition: border-color 0.2s ease;
    }

    .sponsor-placeholder:hover {
      border-color: rgba(255,255,255,0.12);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes slideDown {
      from { opacity: 0; height: 0; overflow: hidden; }
      to { opacity: 1; height: auto; }
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <main class="main-container">
      <header>
        <span class="subtitle">Audio Scraper & Extractor</span>
        <h1>YouTube Converter</h1>
      </header>

      <section class="downloader-form">
        <div class="input-group">
          <input type="text" id="url-input" placeholder="Paste YouTube link or video ID..." value="dQw4w9WgXcQ">
        </div>
        <button id="download-btn" class="btn">
          <span>🔍</span> Fetch Video Info
        </button>
      </section>

      <section id="metadata-card" class="metadata-card">
        <div class="video-info-wrapper">
          <div class="video-thumbnail-container">
            <img id="metadata-thumbnail" class="video-thumbnail" src="" alt="Thumbnail">
          </div>
          <div class="video-details">
            <div id="metadata-title" class="metadata-title">Video Title</div>
            <div id="metadata-artist" class="metadata-artist">Artist</div>
          </div>
        </div>

        <div id="format-selector-container" class="dropdown-container">
          <div class="dropdown-label">Select Audio Quality</div>
          <select id="format-select"></select>
          <button id="start-download-btn" class="btn" style="margin-top: 14px; background-color: var(--text); color: #000;">
            <span>⬇️</span> Download Selected Quality
          </button>
        </div>

        <div id="progress-container" class="progress-container">
          <div class="progress-bar">
            <div id="progress-bar" class="progress-bar-fill"></div>
          </div>
          <div class="progress-labels">
            <span id="status-label">Extracting track fragments...</span>
            <span id="percent-label">0%</span>
          </div>
        </div>

        <!-- Custom Audio Player -->
        <div id="custom-player" class="custom-player">
          <div class="player-controls-wrapper">
            <button id="player-play-btn" class="player-btn" title="Play">
              <!-- Play Icon SVG -->
              <svg id="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
              <!-- Pause Icon SVG (hidden initially) -->
              <svg id="pause-icon" style="display: none;" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>

            <div class="player-timeline-container">
              <span id="player-current-time" class="player-time">0:00</span>
              <input type="range" id="player-progress" class="player-slider" min="0" max="100" value="0">
              <span id="player-duration" class="player-time">0:00</span>
            </div>

            <div class="player-volume-container">
              <span id="player-volume-btn" class="volume-icon">
                <!-- Volume High SVG -->
                <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
              </span>
              <input type="range" id="player-volume" class="volume-slider" min="0" max="100" value="80">
            </div>
          </div>
          <audio id="hidden-audio-element" style="display: none;"></audio>
        </div>
      </section>

      <!-- Toggle Console Drawer -->
      <button id="console-trigger" class="console-drawer-trigger">
        <span>⚙️</span> Show Dev Console
      </button>

      <div id="console-drawer" class="console-drawer">
        <div id="console" class="console">
          <div class="console-line info">[System] Standby. Enter link to begin.</div>
        </div>
      </div>
    </main>

    <!-- Ad Sponsor Card -->
    <section class="sponsor-card">
      <div class="sponsor-header">Advertisement</div>
      <div class="sponsor-placeholder">
        <div style="font-weight: 600; margin-bottom: 4px; color: var(--text);">Support this Converter</div>
        <div style="font-size: 11px;">Your advertisement code can be pasted here.</div>
      </div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
