<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Local Client-Side YouTube Downloader (Method A)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #10b981; /* Emerald Green */
      --primary-glow: rgba(16, 185, 129, 0.4);
      --secondary: #3b82f6; /* Blue */
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      position: relative;
    }

    .container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border-radius: 26px;
      z-index: -1;
      opacity: 0.15;
    }

    header {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-container {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      background: rgba(16, 185, 129, 0.1);
      border: 1.5px solid var(--primary);
      border-radius: 18px;
      margin-bottom: 16px;
      box-shadow: 0 0 20px var(--primary-glow);
    }

    .logo-icon {
      font-size: 32px;
      color: var(--primary);
    }

    h1 {
      font-weight: 800;
      font-size: 28px;
      margin-bottom: 8px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
    }

    .form-group {
      margin-bottom: 24px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text);
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="text"] {
      width: 100%;
      padding: 16px 20px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      color: var(--text);
      font-size: 15px;
      transition: all 0.3s ease;
      font-family: inherit;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.2);
      background: rgba(15, 23, 42, 0.8);
    }

    .btn {
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, var(--primary) 0%, #059669 100%);
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 14px var(--primary-glow);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.6);
    }

    .btn:active {
      transform: translateY(0);
    }

    .btn:disabled {
      background: #475569;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    /* Progress & Metadata Info */
    .metadata-card {
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 20px;
      margin-top: 24px;
      display: none;
      animation: fadeIn 0.4s ease;
    }

    .metadata-title {
      font-weight: 600;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .metadata-artist {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: var(--primary);
      transition: width 0.3s ease;
      box-shadow: 0 0 10px var(--primary);
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Console Log Section */
    .console-section {
      margin-top: 32px;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .console-title {
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }

    .console {
      background: #090d16;
      border: 1.5px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      max-height: 200px;
      overflow-y: auto;
      color: #34d399;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8);
    }

    .console-line {
      margin-bottom: 6px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .console-line.info { color: #38bdf8; }
    .console-line.success { color: #34d399; }
    .console-line.warning { color: #fbbf24; }
    .console-line.error { color: #f87171; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <main class="container">
    <header>
      <div class="logo-container">
        <span class="logo-icon">⚡</span>
      </div>
      <h1>YouTube Downloader</h1>
      <p class="subtitle">Fully Client-Side Extraction & Local Muxing via CORS Proxy</p>
    </header>

    <section class="downloader-form">
      <div class="form-group">
        <label for="url-input">YouTube URL or Video ID</label>
        <div class="input-wrapper">
          <input type="text" id="url-input" placeholder="e.g. dQw4w9WgXcQ or https://www.youtube.com/watch?v=dQw4w9WgXcQ" value="dQw4w9WgXcQ">
        </div>
      </div>

      <button id="download-btn" class="btn">
        <span>🔍</span> Fetch Video Info
      </button>
    </section>

    <section id="metadata-card" class="metadata-card">
      <img id="metadata-thumbnail" src="" alt="Thumbnail" style="display: none; width: 100%; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--card-border); box-shadow: 0 4px 10px rgba(0,0,0,0.5);">
      <div id="metadata-title" class="metadata-title">Video Title</div>
      <div id="metadata-artist" class="metadata-artist">Artist</div>
      
      <div id="format-selector-container" style="display: none; margin-top: 16px; border-top: 1px solid var(--card-border); padding-top: 16px;">
        <label for="format-select">Select Audio Quality</label>
        <select id="format-select" style="width: 100%; padding: 14px 20px; background: rgba(15, 23, 42, 0.8); border: 1px solid var(--card-border); border-radius: 12px; color: var(--text); font-size: 14px; font-family: inherit; margin-bottom: 20px; outline: none; cursor: pointer;"></select>
        <button id="start-download-btn" class="btn" style="background: linear-gradient(135deg, var(--secondary) 0%, #1d4ed8 100%); box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);">
          <span>⬇️</span> Download Audio Track
        </button>
      </div>

      <div id="progress-container" style="display: none; margin-top: 16px; border-top: 1px solid var(--card-border); padding-top: 16px;">
        <div class="progress-bar-container">
          <div id="progress-bar" class="progress-bar-fill"></div>
        </div>
        <div class="progress-text">
          <span id="status-label">Initializing...</span>
          <span id="percent-label">0%</span>
        </div>
      </div>
    </section>

    <section class="console-section">
      <div class="console-header">
        <span class="console-title">Execution Log</span>
      </div>
      <div id="console" class="console">
        <div class="console-line info">[System] Ready. Enter a YouTube URL and click download.</div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
