build:
  name: Owenisas Music Downloader TestFlight
  steps:
    - eas/checkout
    - run:
        name: Verify non-beta Xcode 26.4
        command: |
          set -eo pipefail
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          if [[ "$XCODE_VERSION" == *[Bb][Ee][Tt][Aa]* ]]; then
            echo "ERROR: beta Xcode detected; refusing App Store archive."
            exit 1
          fi
          case "$XCODE_VERSION" in
            'Xcode 26.4'* ) ;;
            * )
              echo "ERROR: expected release Xcode 26.4.x."
              exit 1
              ;;
          esac
    - run:
        name: Import distribution certificate
        command: |
          set -eo pipefail
          : "${OWENISAS_MUSIC_P12_B64:?missing OWENISAS_MUSIC_P12_B64}"
          : "${OWENISAS_MUSIC_P12_PASSWORD:?missing OWENISAS_MUSIC_P12_PASSWORD}"
          KC="$PWD/owenisas-music-ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          echo "$OWENISAS_MUSIC_P12_B64" | base64 -D > "$PWD/owenisas-music-dist.p12"
          security import "$PWD/owenisas-music-dist.p12" -k "$KC" -P "$OWENISAS_MUSIC_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          rm -f "$PWD/owenisas-music-dist.p12"
    - run:
        name: Write App Store Connect API key
        command: |
          set -eo pipefail
          : "${OWENISAS_MUSIC_ASC_KEY_ID:?missing OWENISAS_MUSIC_ASC_KEY_ID}"
          : "${OWENISAS_MUSIC_ASC_ISSUER_ID:?missing OWENISAS_MUSIC_ASC_ISSUER_ID}"
          : "${OWENISAS_MUSIC_ASC_P8_B64:?missing OWENISAS_MUSIC_ASC_P8_B64}"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$OWENISAS_MUSIC_ASC_P8_B64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${OWENISAS_MUSIC_ASC_KEY_ID}.p8"
    - run:
        name: Install verified App Store profiles and configure manual release signing
        command: |
          set -eo pipefail
          python3 .eas/build/install-profiles.py
          ruby <<'RUBY'
          require 'json'
          require 'xcodeproj'
          settings = JSON.parse(File.read('signing-settings.json'))
          project = Xcodeproj::Project.open('Owenisas Music.xcodeproj')
          configured = []
          project.targets.each do |target|
            target.build_configurations.select { |config| config.name == 'Release' }.each do |config|
              bundle = config.build_settings['PRODUCT_BUNDLE_IDENTIFIER']
              next unless settings['profiles'].key?(bundle)
              config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
              config.build_settings['DEVELOPMENT_TEAM'] = settings['teamID']
              config.build_settings['CODE_SIGN_IDENTITY'] = settings['identity']
              config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = settings['profiles'].fetch(bundle)
              configured << bundle
            end
          end
          abort 'Missing or duplicate release signing target' unless configured.sort == settings['profiles'].keys.sort
          project.save
          puts 'Configured all five Release targets for manual App Store signing'
          RUBY
    - run:
        name: Archive Owenisas Music
        command: |
          set -eo pipefail
          # Verified per-target App Store profiles avoid automatic development
          # certificate creation/revocation and preserve extension-specific flags.
          KC="$PWD/owenisas-music-ci.keychain-db"
          security unlock-keychain -p ci "$KC"
          xcodebuild -project 'Owenisas Music.xcodeproj' -scheme 'Owenisas Music' -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/Owenisas Music.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=3LHSL95J9H \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited)' \
            OWENISAS_DISTRIBUTION=personal \
            archive
          APP="$PWD/Owenisas Music.xcarchive/Products/Applications/Owenisas Music.app"
          python3 .eas/build/validate-app-intents.py "$APP"
          EXPECTED_BUILD=$(node -p "require('./app.json').expo.ios.buildNumber")
          EXPECTED_VERSION=$(node -p "require('./app.json').expo.version")
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$EXPECTED_BUILD"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$EXPECTED_VERSION"
          while IFS= read -r PLIST; do
            PRODUCT="${PLIST%/Info.plist}"
            test -f "$PRODUCT/PrivacyInfo.xcprivacy"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")" = "$EXPECTED_BUILD"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")" = "$EXPECTED_VERSION"
          done < <(find "$APP" -name Info.plist)
          test -f "$APP/PrivacyInfo.xcprivacy"
          # This TestFlight lane must retain the requested downloader.
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          strings "$BIN" > "$PWD/beta-binary-strings.txt"
          grep -q 'Paste a YouTube link or playlist URL' "$PWD/beta-binary-strings.txt" || { echo 'ERROR: Download screen missing'; exit 1; }
          grep -q 'youtubei/v1/player' "$PWD/beta-binary-strings.txt" || { echo 'ERROR: Downloader endpoint missing'; exit 1; }
          echo 'Verified Download Music screen and downloader endpoint in archived executable'
          /usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionAttributes:NSExtensionActivationRule' \
            "$APP/PlugIns/OwenisasShare.appex/Info.plist" | grep -qE 'public\.(url|plain-text)'
    - run:
        name: Export Owenisas Music IPA
        command: |
          set -eo pipefail
          KC="$PWD/owenisas-music-ci.keychain-db"
          security unlock-keychain -p ci "$KC"
          test -f "$PWD/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$PWD/Owenisas Music.xcarchive" \
            -exportPath "$PWD/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC"
    - eas/upload_artifact:
        name: Upload Owenisas Music IPA artifact
        inputs:
          type: application-archive
          path: export/*.ipa
    - run:
        name: Validate App Store Connect candidate (upload is separate)
        command: |
          set -eo pipefail
          : "${OWENISAS_MUSIC_ASC_KEY_ID:?missing OWENISAS_MUSIC_ASC_KEY_ID}"
          : "${OWENISAS_MUSIC_ASC_ISSUER_ID:?missing OWENISAS_MUSIC_ASC_ISSUER_ID}"
          : "${OWENISAS_MUSIC_ASC_P8_B64:?missing OWENISAS_MUSIC_ASC_P8_B64}"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$OWENISAS_MUSIC_ASC_P8_B64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${OWENISAS_MUSIC_ASC_KEY_ID}.p8"
          set -- "$PWD/export"/*.ipa
          IPA="$1"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$OWENISAS_MUSIC_ASC_KEY_ID" --apiIssuer "$OWENISAS_MUSIC_ASC_ISSUER_ID"
