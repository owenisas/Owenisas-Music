build:
  name: Owenisas Music iOS App Store Release
  steps:
    - eas/checkout
    - run:
        name: Verify non-beta Xcode 26.4
        command: |
          set -eo pipefail
          XCODE_VERSION="$(xcodebuild -version)"
          printf '%s\n' "$XCODE_VERSION"
          if [[ "$XCODE_VERSION" == *[Bb][Ee][Tt][Aa]* ]]; then
            echo "ERROR: beta Xcode detected; refusing App Store archive."
            exit 1
          fi
          case "$XCODE_VERSION" in
            'Xcode 26.4'* ) ;;
            * )
              echo "ERROR: expected release Xcode 26.4.x."
              exit 1
              ;;
          esac
    - run:
        name: Import manual signing assets
        command: |
          set -eo pipefail
          : "${OWENISAS_MUSIC_P12_B64:?missing OWENISAS_MUSIC_P12_B64}"
          : "${OWENISAS_MUSIC_P12_PASSWORD:?missing OWENISAS_MUSIC_P12_PASSWORD}"
          : "${OWENISAS_MUSIC_PROFILE_B64:?missing OWENISAS_MUSIC_PROFILE_B64}"
          KC="$PWD/owenisas-music-ci.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p ci "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | sed s/\"//g)
          echo "$OWENISAS_MUSIC_P12_B64" | base64 -D > "$PWD/owenisas-music-dist.p12"
          security import "$PWD/owenisas-music-dist.p12" -k "$KC" -P "$OWENISAS_MUSIC_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k ci "$KC" >/dev/null
          security find-identity -v -p codesigning "$KC"
          PROF_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROF_DIR"
          echo "$OWENISAS_MUSIC_PROFILE_B64" | base64 -D > "$PWD/owenisas-music.mobileprovision"
          UUID=$(security cms -D -i "$PWD/owenisas-music.mobileprovision" | plutil -extract UUID raw -o - -)
          cp "$PWD/owenisas-music.mobileprovision" "$PROF_DIR/$UUID.mobileprovision"
          rm -f "$PWD/owenisas-music-dist.p12"
    - run:
        name: Archive Owenisas Music
        command: |
          set -eo pipefail
          KC="$PWD/owenisas-music-ci.keychain-db"
          security unlock-keychain -p ci "$KC"
          xcodebuild -project 'Owenisas Music.xcodeproj' -scheme 'Owenisas Music' -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/Owenisas Music.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=3LHSL95J9H \
            CODE_SIGN_IDENTITY='Apple Distribution: Tsz To Suen (3LHSL95J9H)' \
            PROVISIONING_PROFILE_SPECIFIER='Owenisas Music Cloud App Store 20260812' \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC" \
            archive
          APP="$PWD/Owenisas Music.xcarchive/Products/Applications/Owenisas Music.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = '202608120103'
          test -f "$APP/PrivacyInfo.xcprivacy"
          if strings "$APP/Owenisas Music" | grep -E 'Download Music|Paste a YouTube|youtubei/v1/player'; then
            echo "ERROR: policy-sensitive downloader found in shipping binary"
            exit 1
          fi
    - run:
        name: Export Owenisas Music IPA
        command: |
          set -eo pipefail
          KC="$PWD/owenisas-music-ci.keychain-db"
          security unlock-keychain -p ci "$KC"
          cat > "$PWD/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>destination</key><string>export</string>
            <key>method</key><string>app-store-connect</string>
            <key>signingStyle</key><string>manual</string>
            <key>teamID</key><string>3LHSL95J9H</string>
            <key>provisioningProfiles</key><dict>
              <key>com.Owenisas-Music</key><string>Owenisas Music Cloud App Store 20260812</string>
            </dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$PWD/Owenisas Music.xcarchive" \
            -exportPath "$PWD/export" \
            -exportOptionsPlist "$PWD/ExportOptions.plist" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KC"
    - eas/upload_artifact:
        name: Upload Owenisas Music IPA artifact
        inputs:
          type: application-archive
          path: export/*.ipa
    - run:
        name: Validate and upload to App Store Connect
        command: |
          set -eo pipefail
          : "${OWENISAS_MUSIC_ASC_KEY_ID:?missing OWENISAS_MUSIC_ASC_KEY_ID}"
          : "${OWENISAS_MUSIC_ASC_ISSUER_ID:?missing OWENISAS_MUSIC_ASC_ISSUER_ID}"
          : "${OWENISAS_MUSIC_ASC_P8_B64:?missing OWENISAS_MUSIC_ASC_P8_B64}"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$OWENISAS_MUSIC_ASC_P8_B64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_${OWENISAS_MUSIC_ASC_KEY_ID}.p8"
          set -- "$PWD/export"/*.ipa
          IPA="$1"
          xcrun altool --validate-app -f "$IPA" -t ios --apiKey "$OWENISAS_MUSIC_ASC_KEY_ID" --apiIssuer "$OWENISAS_MUSIC_ASC_ISSUER_ID"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$OWENISAS_MUSIC_ASC_KEY_ID" --apiIssuer "$OWENISAS_MUSIC_ASC_ISSUER_ID"
